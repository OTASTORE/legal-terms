33% {transform:translate(30px,-40px) scale(1.08);}
66% {transform:translate(-25px,25px) scale(.95);}
}

@keyframes floatReverse {
0%,100% {transform:translate(0,0) scale(1);}
50% {transform:translate(-35px,-30px) scale(1.1);}
}

.orb-1 {animation:floatSlow 14s ease-in-out infinite;}
.orb-2 {animation:floatReverse 18s ease-in-out infinite;}

.glass-card {

.glass-card:hover {
transform:translateY(-3px);

}

@keyframes pulseGlow {
0%,100% {box-shadow:0 0 18px rgba(0,136,204,.45);}
50% {box-shadow:0 0 30px rgba(56,189,248,.75);}
}

.telegram-btn {
background:linear-gradient(135deg,#0088cc,#0ea5e9);

transition:.3s;
}

.telegram-btn:hover {transform:translateY(-2px) scale(1.02);}

.whatsapp-btn {
background:linear-gradient(135deg,#087f43,#16a34a);
box-shadow:0 0 18px rgba(22,163,74,.2);
transition:.3s;
}

.whatsapp-btn:hover {
transform:translateY(-2px) scale(1.02);
box-shadow:0 0 25px rgba(22,163,74,.4);
}

@keyframes fadeInUp {
from {opacity:0;transform:translateY(24px);}
to {opacity:1;transform:translateY(0);}
}

.reveal-card {
opacity:0;
animation:fadeInUp .7s ease forwards;
}

.lang-fade {transition:opacity .25s,transform .25s;}
.lang-switching {opacity:0;transform:translateY(6px);}

.blue-text-gradient {
background:linear-gradient(90deg,#38bdf8,#00a8ff,#60a5fa);

#particleCanvas {
position:fixed;
inset:0;
width:100%;
height:100%;

#sectionsContainer {

@media(max-width:390px) {

container.appendChild(card);
});
}

function toggleLanguage() {
const wrapper=document.getElementById('contentWrapper');
wrapper.classList.add('lang-switching');

setTimeout(()=>{
currentLang=currentLang==='ar'?'en':'ar';
renderContent(currentLang);
wrapper.classList.remove('lang-switching');
},220);
}

function initParticles() {
const canvas=document.getElementById('particleCanvas');
const ctx=canvas.getContext('2d');
let particles=[];

function resizeCanvas() {
const ratio=Math.min(window.devicePixelRatio||1,2);
canvas.width=window.innerWidth*ratio;
canvas.height=window.innerHeight*ratio;
canvas.style.width=window.innerWidth+'px';
canvas.style.height=window.innerHeight+'px';
ctx.setTransform(ratio,0,0,ratio,0,0);
createParticles();
}

function createParticles() {
particles=[];
const count=Math.min(Math.floor((window.innerWidth*window.innerHeight)/22000),55);
for(let i=0;i<count;i++) {
particles.push({
x:Math.random()*window.innerWidth,
y:Math.random()*window.innerHeight,
vx:(Math.random()-.5)*.4,
vy:(Math.random()-.5)*.4,
radius:Math.random()*1.8+.7,
alpha:Math.random()*.5+.2
});
}
}

function animate() {
ctx.clearRect(0,0,window.innerWidth,window.innerHeight);

for(let i=0;i<particles.length;i++) {
const p=particles[i];
p.x+=p.vx;
p.y+=p.vy;

if(p.x<0||p.x>window.innerWidth)p.vx*=-1;
if(p.y<0||p.y>window.innerHeight)p.vy*=-1;

ctx.beginPath();
ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
ctx.fillStyle=`rgba(56,189,248,${p.alpha})`;
ctx.fill();

for(let j=i+1;j<particles.length;j++) {
const p2=particles[j];
const dist=Math.hypot(p.x-p2.x,p.y-p2.y);

if(dist<130) {
ctx.beginPath();
ctx.moveTo(p.x,p.y);
ctx.lineTo(p2.x,p2.y);
ctx.strokeStyle=`rgba(0,168,255,${.12*(1-dist/130)})`;
ctx.lineWidth=.7;
ctx.stroke();
}
}
}
requestAnimationFrame(animate);
}

resizeCanvas();
window.addEventListener('resize',resizeCanvas);
animate();
}

window.addEventListener('DOMContentLoaded',()=>{
renderContent('ar');
initParticles();
});
</script>
